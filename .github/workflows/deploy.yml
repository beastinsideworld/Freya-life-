name: Déploiement

on:
  push:
    branches: [master, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Image de l'API
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.REGISTRY_IMAGE || 'registry.bariserv.net/freya' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.bariserv.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  front:
    name: GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/freya-web/package-lock.json

      - name: Dépendances
        working-directory: frontend/freya-web
        run: npm ci

      - name: Adresse de l'API
        working-directory: frontend/freya-web
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = (process.env.API_BASE || 'https://freya-life-api.bariserv.net').replace(/\/$/, '');
          fs.writeFileSync('public/config.json', JSON.stringify({ apiBase: base }) + '\n');
          NODE

      - name: Build
        working-directory: frontend/freya-web
        run: npx ng build --configuration=production --base-href /Freya-life-/

      - name: SPA GitHub Pages
        working-directory: frontend/freya-web/dist/freya-web/browser
        run: cp index.html 404.html

      - name: Chemins assets (base-href GitHub Pages)
        working-directory: frontend/freya-web/dist/freya-web/browser
        run: |
          find . -name '*.css' -print0 | xargs -0 sed -i 's|url(/assets/|url(/Freya-life/assets/|g'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/freya-web/dist/freya-web/browser

      - id: deployment
        uses: actions/deploy-pages@v4
